version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: leetcode-db
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode
      POSTGRES_DB: leetcode_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  node-server:
    build: ./node-server
    container_name: node-server
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://leetcode:leetcode@postgres:5432/leetcode_clone
    restart: always

  python-server:
    build: ./python-server
    container_name: python-server
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://leetcode:leetcode@postgres:5432/leetcode_clone
      - SECRET_KEY=supersecret
    restart: always

volumes:
  postgres-data:
